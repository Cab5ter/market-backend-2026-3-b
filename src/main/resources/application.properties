spring.application.name=market-backend-2026-3-b

# Datasource (PostgreSQL local)
spring.datasource.url=jdbc:postgresql://localhost:5432/marked-api
spring.datasource.username=postgres
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Create the schema and load the initial catalogue on startup.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Swagger / OpenAPI (springdoc)
springdoc.swagger-ui.path=/swagger-ui.html

# Include validation details in API error responses.
server.error.include-message=always
